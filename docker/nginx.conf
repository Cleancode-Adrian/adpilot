server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php;
    client_max_body_size 20M;

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    # prywatny panel – zakaz indeksowania także dla plików statycznych
    add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet, noimageindex, noai, noimageai" always;

    # twarda blokada botów AI i wyszukiwarek (robots.txt dalej dostępny)
    set $blocked_bot 0;
    if ($http_user_agent ~* "(gptbot|chatgpt-user|oai-searchbot|claudebot|claude-user|claude-searchbot|claude-web|anthropic-ai|google-extended|googleother|applebot|perplexity|ccbot|bytespider|meta-external|facebookbot|amazonbot|cohere|diffbot|youbot|mistralai|duckassistbot|imagesiftbot|omgilibot|timpibot|googlebot|bingbot|yandex|baiduspider|duckduckbot|petalbot|seznambot|ahrefsbot|semrushbot|mj12bot|dotbot|dataforseobot|blexbot)") {
        set $blocked_bot 1;
    }
    if ($request_uri = /robots.txt) {
        set $blocked_bot 0;
    }
    if ($blocked_bot) {
        return 403;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location /build/ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public, immutable";
        add_header X-Robots-Tag "noindex, nofollow, noarchive, noai, noimageai" always;
    }

    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 120;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }
}
