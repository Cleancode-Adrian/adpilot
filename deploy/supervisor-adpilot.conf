# /etc/supervisor/conf.d/adpilot.conf
# Worker kolejki: audyty, synchronizacja danych, raporty AI, e-maile.
# Po skopiowaniu:  sudo supervisorctl reread && sudo supervisorctl update && sudo supervisorctl status

[program:adpilot-worker]
command=php /var/www/adpilot.projekciarz.pl/artisan queue:work --sleep=3 --tries=2 --timeout=900 --max-time=3600
directory=/var/www/adpilot.projekciarz.pl
user=www-data
numprocs=1
autostart=true
autorestart=true
stopwaitsecs=960
redirect_stderr=true
stdout_logfile=/var/www/adpilot.projekciarz.pl/storage/logs/worker.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
