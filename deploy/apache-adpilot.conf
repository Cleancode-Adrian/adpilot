# Wzór vhosta Apache dla AdPilot (HTTPS – sekcję 443 tworzy certbot).
# Najważniejsze: DocumentRoot na katalog /public i AllowOverride All (dla public/.htaccess).
# Wymagane moduły:  sudo a2enmod rewrite headers proxy_fcgi setenvif expires && sudo systemctl reload apache2

<VirtualHost *:443>
    ServerName adpilot.projekciarz.pl
    DocumentRoot /var/www/adpilot.projekciarz.pl/public

    <Directory /var/www/adpilot.projekciarz.pl/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # PHP 8.5 przez PHP-FPM (jeśli nie masz globalnego conf "php8.5-fpm": sudo a2enconf php8.5-fpm)
    <FilesMatch \.php$>
        SetHandler "proxy:unix:/run/php/php8.5-fpm.sock|fcgi://localhost"
    </FilesMatch>

    LimitRequestBody 20971520

    ErrorLog ${APACHE_LOG_DIR}/adpilot-error.log
    CustomLog ${APACHE_LOG_DIR}/adpilot-access.log combined

    # Linie SSLCertificateFile / Include options-ssl-apache.conf dopisuje certbot – zostaw je.
</VirtualHost>
