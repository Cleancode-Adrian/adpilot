# /etc/nginx/sites-available/adpilot.projekciarz.pl
# Dopasuj ścieżkę gniazda PHP-FPM do wersji PHP na serwerze (ls /run/php/).
# HTTPS: sudo certbot --nginx -d adpilot.projekciarz.pl  (certbot sam dopisze sekcję 443)

server {
    listen 80;
    server_name adpilot.projekciarz.pl;
    root /var/www/adpilot.projekciarz.pl/public;
    index index.php;
    client_max_body_size 20M;
    charset utf-8;

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet, noimageindex, noai, noimageai" always;

    # blokada botów AI i wyszukiwarek (robots.txt zostaje dostępny)
    set $blocked_bot 0;
    if ($http_user_agent ~* "(gptbot|chatgpt-user|oai-searchbot|claudebot|claude-user|claude-searchbot|claude-web|anthropic-ai|google-extended|googleother|applebot|perplexity|ccbot|bytespider|meta-external|facebookbot|amazonbot|cohere|diffbot|youbot|mistralai|duckassistbot|imagesiftbot|omgilibot|timpibot|googlebot|bingbot|yandex|baiduspider|duckduckbot|petalbot|seznambot|ahrefsbot|semrushbot|mj12bot|dotbot|dataforseobot|blexbot)") {
        set $blocked_bot 1;
    }
    if ($request_uri = /robots.txt) {
        set $blocked_bot 0;
    }
    if ($blocked_bot) {
        return 403;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }

    location /build/ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public, immutable";
    }

    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;   # ← sprawdź wersję!
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 120;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }
}
